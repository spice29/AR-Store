name: ABUREMAS
options:
  bundleIdPrefix: com.aburemas
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: ABUREMAS
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  ABUREMAS:
    type: application
    platform: iOS
    sources: [ABUREMAS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aburemas.store
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
